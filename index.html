<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Czech Accent Key Sequence Visualizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Sora:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #e8eaed;
      --surface: #ffffff;
      --ink: #20242c;
      --muted: #7b818c;
      --line: #e4e6ea;
      --line-strong: #d2d5db;
      --key-border: #d3d6dd;
      --badge: #e07b3c;
      --badge-hold: #2f9e6a;
      --badge-hs: #8a5cc4;
      --radius: 10px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Manrope", "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
      display: flex;
      justify-content: center;
      padding: 40px 24px 56px;
    }

    .shell {
      width: min(880px, 100%);
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    /* ---------- Header (light, secondary) ---------- */
    .head {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    h1 {
      margin: 0;
      font-family: "Sora", sans-serif;
      font-size: clamp(1.3rem, 2vw, 1.7rem);
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .sub {
      margin: 0;
      color: var(--muted);
      font-size: 0.94rem;
      line-height: 1.45;
    }

    /* ---------- Controls (clearly secondary) ---------- */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .controls label {
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    input {
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      padding: 12px 13px;
      font-size: 0.98rem;
      font-family: "Manrope", sans-serif;
      background: var(--surface);
      color: var(--ink);
      transition: border-color 140ms ease;
    }

    input:focus {
      outline: none;
      border-color: #9aa0ac;
    }

    .hint {
      color: var(--muted);
      font-size: 0.84rem;
      line-height: 1.6;
      margin: 0;
    }

    .hint code {
      font-family: "Manrope", monospace;
      font-weight: 700;
      font-size: 0.82rem;
      color: #565c66;
      background: #eceef1;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 1px 5px;
      white-space: nowrap;
    }

    .err {
      color: #b4503a;
      font-weight: 600;
      font-size: 0.86rem;
      min-height: 1.2em;
      margin: 0;
    }

    /* ---------- Stage (the focus / screenshot target) ---------- */
    .stage {
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      box-shadow: 0 1px 0 #f4f5f7 inset, 6px 6px 0 rgba(32, 36, 44, 0.10);
      overflow: hidden;
    }

    .stage-block {
      padding: 24px 26px;
    }

    .stage-divider {
      height: 1px;
      background: var(--line);
    }

    .block-title {
      margin: 0 0 16px;
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #9298a3;
    }

    .keys {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      min-height: 64px;
      align-items: center;
    }

    .key {
      position: relative;
      min-width: 60px;
      height: 60px;
      border-radius: 7px;
      border: 1px solid var(--key-border);
      background: #fbfbfc;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 1.12rem;
      text-transform: lowercase;
      color: #2a2f38;
      box-shadow: 0 2px 0 #d7dade;
      animation: key-in 240ms ease both;
    }

    .token {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .plus {
      font-weight: 700;
      color: #aab0ba;
      font-size: 0.95rem;
    }

    .key.mod {
      min-width: 72px;
      font-size: 0.76rem;
      text-transform: none;
      letter-spacing: 0.04em;
      background: #e8effb;
      border-color: #a3bee6;
      color: #37588f;
    }

    .key.hold {
      background:
        repeating-linear-gradient(
          -45deg,
          rgba(47, 158, 106, 0.20),
          rgba(47, 158, 106, 0.20) 5px,
          #f1faf5 5px,
          #f1faf5 11px
        );
      border-color: #8eccac;
    }

    @keyframes key-in {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .key .count {
      position: absolute;
      top: -7px;
      right: -7px;
      width: 20px;
      height: 20px;
      border-radius: 999px;
      background: var(--badge);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      display: grid;
      place-items: center;
      line-height: 1;
      border: 2px solid var(--surface);
    }

    .key .count.hold-count {
      background: var(--badge-hold);
      width: auto;
      min-width: 20px;
      padding: 0 5px;
      gap: 2px;
      grid-auto-flow: column;
    }

    .key .count.hold-count svg {
      width: 11px;
      height: 11px;
      display: block;
    }

    .hs-combo {
      display: inline-flex;
      align-items: center;
    }

    .hs-keys {
      display: inline-flex;
      align-items: center;
    }

    .hs-keys .key {
      background: #f3ecfb;
      border-color: #c6a9e6;
      color: #5b4685;
    }

    .hs-link {
      position: relative;
      z-index: 2;
      margin: 0 -8px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--badge-hs);
      color: #fff;
      font-size: 0.82rem;
      font-weight: 700;
      display: grid;
      place-items: center;
      border: 2px solid var(--surface);
    }

    .result {
      font-family: "Sora", sans-serif;
      font-size: clamp(2rem, 5vw, 3.1rem);
      font-weight: 700;
      letter-spacing: 0.01em;
      color: #1b1f27;
      min-height: 1.2em;
      display: flex;
      align-items: center;
    }

    /* ---------- Demos (tertiary) ---------- */
    .demos-wrap {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .section-label {
      margin: 0;
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .demo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 8px;
    }

    .demo-btn {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: transparent;
      text-align: left;
      padding: 11px 12px;
      cursor: pointer;
      transition: background 120ms ease, border-color 120ms ease;
      font-family: "Manrope", sans-serif;
    }

    .demo-btn:hover {
      background: #f1f2f4;
      border-color: var(--line-strong);
    }

    .demo-name {
      font-size: 0.82rem;
      font-weight: 700;
      color: #4a4f59;
      margin-bottom: 5px;
    }

    .demo-seq {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 4px;
      word-break: break-word;
      font-variant-numeric: tabular-nums;
    }

    .demo-out {
      font-family: "Sora", sans-serif;
      color: #2c313a;
      font-size: 0.95rem;
    }

    @media (max-width: 640px) {
      .stage-block {
        padding: 18px 18px;
      }

      .key {
        min-width: 52px;
        height: 52px;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="head">
      <h1>Czech Accent Key Sequence</h1>
      <p class="sub">Render a tap / hold / RAlt / hotstring sequence into Czech accented text.</p>
    </header>

    <section class="controls">
      <label for="sequence">Sequence</label>
      <input id="sequence" type="text" value="s2 l e3 p e2 j" spellcheck="false" aria-describedby="sequence-help" />
      <p id="sequence-help" class="hint">Tokens: tap <code>s4</code> · hold <code>s~2</code> · pre <code>RAlt+e</code> · post <code>a+RAlt</code> · hotstring <code>hs(cv)</code></p>
      <p id="error" class="err" aria-live="polite"></p>
    </section>

    <section class="stage">
      <div class="stage-block">
        <h2 class="block-title">Key Sequence</h2>
        <div id="keys" class="keys"></div>
      </div>
      <div class="stage-divider"></div>
      <div class="stage-block">
        <h2 class="block-title">Output</h2>
        <div id="output" class="result"></div>
      </div>
    </section>

    <section class="demos-wrap">
      <h2 class="section-label">Method demos</h2>
      <div id="demos" class="demo-grid"></div>
    </section>
  </div>

  <script>
    const tapMapping = {
      a: ["a", "á"],
      c: ["c", "č"],
      d: ["d", "ď"],
      e: ["e", "ě", "é"],
      i: ["i", "í"],
      n: ["n", "ň"],
      o: ["o", "ó"],
      r: ["r", "ř"],
      s: ["s", "š"],
      t: ["t", "ť"],
      u: ["u", "ů", "ú"],
      y: ["y", "ý"],
      z: ["z", "ž"],
      "~": ["~", "°"]
    };

    const preRAltMap = {
      a: "á",
      c: "č",
      d: "ď",
      e: "ě",
      i: "í",
      n: "ň",
      o: "ó",
      r: "ř",
      s: "š",
      t: "ť",
      u: "ú",
      y: "ý",
      z: "ž",
      ";": "ů",
      "'": "é"
    };

    const preRAltDoubleMap = {
      e: "é"
    };

    const hotstringMap = {
      as: "á",
      cv: "č",
      df: "ď",
      er: "ě",
      io: "í",
      nm: "ň",
      op: "ó",
      rt: "ř",
      sd: "š",
      ty: "ť",
      ui: "ů",
      yu: "ý",
      zx: "ž",
      we: "é"
    };

    const cycleNext = buildCycleMap(tapMapping);

    const sequenceInput = document.getElementById("sequence");
    const keysEl = document.getElementById("keys");
    const outputEl = document.getElementById("output");
    const errorEl = document.getElementById("error");
    const demosEl = document.getElementById("demos");

    const methodDemos = [
      {
        name: "Taps (CzechAccentsTaps)",
        sequence: "s2 l e3 p e2 j",
        expected: "šlépěj"
      },
      {
        name: "Hold (CzechAccentsHold)",
        sequence: "s~1 l e~2 p e~1 j",
        expected: "šlépěj"
      },
      {
        name: "Pre RAlt (CzechAccentsPre)",
        sequence: "RAlt+s l RAlt+e+e p RAlt+e j",
        expected: "šlépěj"
      },
      {
        name: "Post RAlt (CzechAccentsPost)",
        sequence: "s+RAlt l e+RAlt+RAlt p e+RAlt j",
        expected: "šlépěj"
      },
      {
        name: "Hotstrings (CzechAccentsHotstrings)",
        sequence: "hs(sd) l hs(we) p hs(er) j",
        expected: "šlépěj"
      }
    ];

    function buildCycleMap(mapping) {
      const next = {};

      for (const variants of Object.values(mapping)) {
        for (let i = 0; i < variants.length; i++) {
          const cur = variants[i];
          const nxt = variants[(i + 1) % variants.length];
          next[cur] = nxt;
          next[cur.toUpperCase()] = nxt.toUpperCase();
        }
      }

      return next;
    }

    function parseToken(token) {
      let m = token.match(/^hs\((.{2})\)$/iu);
      if (m) {
        return { type: "hotstring", combo: m[1] };
      }

      m = token.match(/^ralt\+(.+)$/iu);
      if (m) {
        const keys = m[1].split("+");
        return { type: "pre-ralt", key: keys[0], count: keys.length };
      }

      m = token.match(/^(.{1})((?:\+ralt)+)$/iu);
      if (m) {
        const presses = (m[2].match(/\+ralt/giu) || []).length;
        return { type: "post-ralt", key: m[1], presses };
      }

      m = token.match(/^(.{1})~(\d+)$/u);
      if (m) {
        const intervals = Number(m[2]);
        if (!Number.isInteger(intervals) || intervals < 1) {
          return null;
        }
        return { type: "hold", key: m[1], intervals };
      }

      m = token.match(/^(.{1})(\d+)?$/u);
      if (m) {
        const count = m[2] ? Number(m[2]) : 1;
        if (!Number.isInteger(count) || count < 1) {
          return null;
        }
        return { type: "tap", key: m[1], count };
      }

      return null;
    }

    function applyTapOutput(key, count) {
      const variants = tapMapping[key.toLowerCase()];
      if (!variants) {
        return key.repeat(count);
      }

      const cycleLen = variants.length;
      const cycleIndex = ((count - 1) % cycleLen);
      const repeatCount = Math.ceil(count / cycleLen);
      const selected = variants[cycleIndex];

      return selected.repeat(repeatCount);
    }

    function toggleOnce(char) {
      return cycleNext[char] || char;
    }

    function applyHoldOutput(key, intervals) {
      let out = key;
      for (let i = 0; i < intervals; i++) {
        out = toggleOnce(out);
      }
      return out;
    }

    function applyPreRAltOutput(key, count = 1) {
      const lower = key.toLowerCase();
      const mapped = (count >= 2 && preRAltDoubleMap[lower]) || preRAltMap[lower];
      if (!mapped) {
        return key;
      }
      const isLetter = /^\p{L}$/u.test(key);
      const isUpperLetter = isLetter && key === key.toUpperCase();
      return isUpperLetter ? mapped.toUpperCase() : mapped;
    }

    function applyPostRAltOutput(key, presses) {
      let out = key;
      for (let i = 0; i < presses; i++) {
        out = toggleOnce(out);
      }
      return out;
    }

    function applyHotstringOutput(combo) {
      const lower = combo.toLowerCase();
      const mapped = hotstringMap[lower];
      if (!mapped) {
        return combo;
      }

      const accentPos = lower === "we" ? 1 : 0;
      const sourceChar = combo[accentPos] || combo[0];
      return sourceChar === sourceChar.toUpperCase() ? mapped.toUpperCase() : mapped;
    }

    function createKey(label, classes = []) {
      const keycap = document.createElement("div");
      keycap.className = ["key", ...classes].join(" ");
      const text = document.createElement("span");
      text.textContent = label;
      keycap.appendChild(text);
      return keycap;
    }

    function addCountBadge(keycap, text, className = "") {
      const badge = document.createElement("span");
      badge.className = className ? "count " + className : "count";
      if (className.includes("hold-count")) {
        badge.innerHTML =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
          '<circle cx="12" cy="13" r="8"></circle>' +
          '<path d="M12 9v4l2.5 2.5"></path>' +
          '<path d="M9 2h6"></path>' +
          '</svg>';
        const num = document.createElement("span");
        num.textContent = text;
        badge.appendChild(num);
      } else {
        badge.textContent = text;
      }
      keycap.appendChild(badge);
    }

    function renderToken(parsed) {
      const tokenEl = document.createElement("div");
      tokenEl.className = "token";

      if (parsed.type === "tap") {
        const keycap = createKey(parsed.key);
        if (parsed.count > 1) {
          addCountBadge(keycap, String(parsed.count));
        }
        tokenEl.appendChild(keycap);
        return tokenEl;
      }

      if (parsed.type === "hold") {
        const keycap = createKey(parsed.key, ["hold"]);
        addCountBadge(keycap, String(parsed.intervals), "hold-count");
        tokenEl.appendChild(keycap);
        return tokenEl;
      }

      if (parsed.type === "pre-ralt") {
        tokenEl.appendChild(createKey("RAlt", ["mod"]));
        for (let i = 0; i < parsed.count; i++) {
          const plus = document.createElement("span");
          plus.className = "plus";
          plus.textContent = "+";
          tokenEl.appendChild(plus);
          tokenEl.appendChild(createKey(parsed.key));
        }
        return tokenEl;
      }

      if (parsed.type === "post-ralt") {
        tokenEl.appendChild(createKey(parsed.key));
        for (let i = 0; i < parsed.presses; i++) {
          const plus = document.createElement("span");
          plus.className = "plus";
          plus.textContent = "+";
          tokenEl.appendChild(plus);
          tokenEl.appendChild(createKey("RAlt", ["mod"]));
        }
        return tokenEl;
      }

      if (parsed.type === "hotstring") {
        const left = parsed.combo[0] || "?";
        const right = parsed.combo[1] || "?";

        const combo = document.createElement("div");
        combo.className = "hs-combo";

        const row = document.createElement("div");
        row.className = "hs-keys";
        row.appendChild(createKey(left));

        const link = document.createElement("span");
        link.className = "hs-link";
        link.textContent = "+";
        row.appendChild(link);

        row.appendChild(createKey(right));
        combo.appendChild(row);

        tokenEl.appendChild(combo);
        return tokenEl;
      }

      return tokenEl;
    }

    function tokenToOutput(parsed) {
      if (parsed.type === "tap") {
        return applyTapOutput(parsed.key, parsed.count);
      }
      if (parsed.type === "hold") {
        return applyHoldOutput(parsed.key, parsed.intervals);
      }
      if (parsed.type === "pre-ralt") {
        return applyPreRAltOutput(parsed.key, parsed.count);
      }
      if (parsed.type === "post-ralt") {
        return applyPostRAltOutput(parsed.key, parsed.presses);
      }
      if (parsed.type === "hotstring") {
        return applyHotstringOutput(parsed.combo);
      }
      return "";
    }

    function render() {
      const raw = sequenceInput.value.trim();
      keysEl.innerHTML = "";
      outputEl.textContent = "";
      errorEl.textContent = "";

      if (!raw) {
        return;
      }

      const tokens = raw.split(/\s+/);
      let out = "";

      for (const token of tokens) {
        const parsed = parseToken(token);
        if (!parsed) {
          errorEl.textContent = "Invalid token: " + token + ". Use s4, s~2, RAlt+e, a+RAlt, or hs(cv).";
          return;
        }

        keysEl.appendChild(renderToken(parsed));
        out += tokenToOutput(parsed);
      }

      outputEl.textContent = out;
    }

    function renderDemos() {
      demosEl.innerHTML = "";

      for (const demo of methodDemos) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "demo-btn";

        const title = document.createElement("div");
        title.className = "demo-name";
        title.textContent = demo.name;

        const seq = document.createElement("div");
        seq.className = "demo-seq";
        seq.textContent = demo.sequence;

        const out = document.createElement("div");
        out.className = "demo-out";
        out.textContent = "→ " + demo.expected;

        button.appendChild(title);
        button.appendChild(seq);
        button.appendChild(out);

        button.addEventListener("click", () => {
          sequenceInput.value = demo.sequence;
          render();
          sequenceInput.focus();
        });

        demosEl.appendChild(button);
      }
    }

    sequenceInput.addEventListener("input", render);
    renderDemos();
    render();
  </script>
</body>
</html>
